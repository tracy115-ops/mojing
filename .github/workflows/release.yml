name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libgtk-3-dev libssl-dev pkg-config

      - name: Install frontend deps
        run: npm ci

      - name: Build & publish Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MoJing ${{ github.ref_name }}'
          releaseBody: |
            ### 📦 MoJing ${{ github.ref_name }} 安装包说明

            #### 💻 Windows
            下载 `x64-setup.exe` 或 `.msi` 直接双击安装。

            #### 🍎 macOS (支持 M 芯片全系列 + Intel 芯片 Mac)
            下载 `.dmg` 文件安装。若提示“已损坏 / 无法验证开发者”，请选择以下任一方式解锁：
            1. **直接发送**：将 `.dmg` / `.app` 通过微信、钉钉或 AirDrop 直接发送给对方，无需命令直接打开。
            2. **终端解封**：在终端运行 `sudo xattr -rd com.apple.quarantine /Applications/MoJing.app`

            #### 🐧 Linux
            下载 `.AppImage` 文件，赋予执行权限后运行：
            `chmod +x *.AppImage && ./*.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
